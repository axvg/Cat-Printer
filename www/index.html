<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>printer-term</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>printer-term</h1>
  <button id="device" class="chip" type="button">buscando…</button>
</header>

<main>
  <label id="drop" for="file" tabindex="0">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4L8 8M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <strong>Arrastra un archivo</strong>
    <span>txt · md · png · jpg · gif · webp · bmp · pdf</span>
    <input id="file" type="file" hidden>
  </label>

  <form id="url-form">
    <input id="url" type="url" placeholder="o pega una URL de imagen" autocomplete="off">
    <button type="submit">Cargar</button>
  </form>

  <figure id="preview" hidden>
    <img id="preview-img" alt="Vista previa del papel">
    <figcaption id="preview-size"></figcaption>
  </figure>

  <fieldset>
    <label class="row">
      <span>Energía</span>
      <input id="energy" type="range" min="20" max="100" step="5" value="50">
      <output id="energy-out">0.50</output>
    </label>

    <label class="row">
      <span>Calidad</span>
      <div class="segmented" id="quality">
        <button type="button" class="on" value="1">1</button>
        <button type="button" value="2">2</button>
        <button type="button" value="3">3</button>
        <button type="button" value="4">4</button>
      </div>
    </label>

    <label class="row check">
      <input id="ascii" type="checkbox">
      <span>ASCII art, sin cortar líneas</span>
    </label>
  </fieldset>

  <button id="print" type="button" disabled>Imprimir</button>
  <p id="status" role="status"></p>
</main>

<script src="app.js" type="module"></script>
</body>
</html>
